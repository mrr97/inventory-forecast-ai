# `docker compose up` builds the whole pipeline once, then serves the dashboard.
#   - pipeline : runs the Dagster asset graph (demo -> train -> optimize -> metrics)
#   - dashboard: Dash UI at http://localhost:8050 (waits for the pipeline to finish)
#   - dagster  : Dagster UI at http://localhost:3000 (the asset graph, materialize on demand)
# Data and the trained model are shared between services through named volumes.

services:
  pipeline:
    build: .
    command: ["inventory-forecast-ai", "pipeline"]
    environment:
      DAGSTER_HOME: /app/.dagster
    volumes:
      - inv_data:/app/data
      - inv_models:/app/models

  dashboard:
    build: .
    command: ["inventory-forecast-ai", "dashboard"]
    environment:
      UI_HOST: 0.0.0.0
    ports:
      - "8050:8050"
    volumes:
      - inv_data:/app/data
      - inv_models:/app/models
    depends_on:
      pipeline:
        condition: service_completed_successfully

  dagster:
    build: .
    command: ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000"]
    environment:
      DAGSTER_HOME: /app/.dagster
    ports:
      - "3000:3000"
    volumes:
      - inv_data:/app/data
      - inv_models:/app/models

volumes:
  inv_data:
  inv_models:
