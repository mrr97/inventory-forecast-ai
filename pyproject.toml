[project]
name = "inventory-forecast-ai"
version = "0.1.0"
description = "Demand forecasting + multi-objective inventory optimization. Predicts demand with CatBoost and explores the cost-vs-service trade-off frontier with pymoo (NSGA-II)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Portfolio" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "typer>=0.12",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
inventory-forecast-ai = "inventory_forecast_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_forecast_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "T20"]
ignore = ["T201"]  # CLI prints are intentional via typer.echo

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
